<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Downloader</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        transition: 0.3s ease;
    }
    :root {
        --bg: #ffffff;
        --text: #000;
        --card: #f0f0f0;
    }
    .dark {
        --bg: #121212;
        --text: #fff;
        --card: #1f1f1f;
    }
    .container {
        max-width: 500px;
        margin: auto;
        padding: 20px;
        background: var(--card);
        border-radius: 15px;
    }
    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 10px;
        border: none;
    }
    button {
        background: #0084ff;
        color: white;
        font-size: 16px;
    }
    #progressBar {
        width: 100%;
        height: 12px;
        background: #ccc;
        border-radius: 10px;
        margin-top: 15px;
        overflow: hidden;
    }
    #progress {
        height: 100%;
        width: 0%;
        background: #00cc66;
        transition: width 0.2s;
    }
    .history {
        margin-top: 20px;
        padding: 10px;
    }
    .history-item {
        background: var(--bg);
        padding: 10px;
        margin-top: 10px;
        border-radius: 10px;
        font-size: 14px;
    }
    .toggle {
        padding: 10px;
        cursor: pointer;
        margin-bottom: 15px;
        background: #444;
        color: white;
        width: 120px;
        text-align: center;
        border-radius: 10px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="toggle" onclick="toggleDarkMode()">Dark Mode</div>

    <h2>Safe Downloader</h2>

    <input type="text" id="url" placeholder="Enter direct download link...">

    <button onclick="startDownload()">Download</button>

    <div id="progressBar">
        <div id="progress"></div>
    </div>

    <p id="status">Status: Idle</p>

    <h3>Download History</h3>
    <div class="history" id="history"></div>
</div>

<script>
    // Restore dark mode
    if (localStorage.getItem("dark") === "true") {
        document.body.classList.add("dark");
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
        localStorage.setItem("dark", document.body.classList.contains("dark"));
    }

    function startDownload() {
        let url = document.getElementById("url").value.trim();
        let status = document.getElementById("status");
        let progress = document.getElementById("progress");

        if (!url) {
            status.textContent = "Please enter a valid URL.";
            return;
        }

        if (url.includes("youtube.com") || url.includes("youtu.be")) {
            status.textContent = "YouTube downloading is not allowed.";
            return;
        }

        status.textContent = "Downloading...";

        // XMLHttpRequest for progress bar
        let xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.responseType = "blob";

        xhr.onprogress = function (event) {
            if (event.lengthComputable) {
                let percent = Math.floor((event.loaded / event.total) * 100);
                progress.style.width = percent + "%";
            }
        };

        xhr.onload = function () {
            if (xhr.status === 200) {
                let blob = xhr.response;
                let a = document.createElement("a");
                a.href = window.URL.createObjectURL(blob);
                a.download = url.split("/").pop();
                a.click();

                saveHistory(a.download);

                status.textContent = "Download complete ✔️";
                progress.style.width = "100%";
            } else {
                status.textContent = "Failed to download file.";
            }
        };

        xhr.onerror = function () {
            status.textContent = "Network error.";
        };

        xhr.send();
    }

    function saveHistory(fileName) {
        let history = JSON.parse(localStorage.getItem("dlHistory") || "[]");

        history.unshift({
            file: fileName,
            date: new Date().toLocaleString()
        });

        localStorage.setItem("dlHistory", JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        let historyBox = document.getElementById("history");
        let history = JSON.parse(localStorage.getItem("dlHistory") || "[]");

        historyBox.innerHTML = "";

        history.forEach(item => {
            let div = document.createElement("div");
            div.className = "history-item";
            div.textContent = `${item.file} — (${item.date})`;
            historyBox.appendChild(div);
        });
    }

    loadHistory();
</script>

</body>
</html>
